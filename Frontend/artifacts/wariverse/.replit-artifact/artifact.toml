kind = "mobile"
previewPath = "/"
title = "WariVerse"
description = "A multilingual conversational companion for Wari pilgrims, with chat, crowd and route guidance, facilities, emergency help, and accessible offline-friendly mobile experiences."
version = "1.0.0"
id = "artifacts/wariverse"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21147

[services.development]
run = "pnpm --filter @workspace/wariverse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wariverse", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wariverse", "run", "serve" ]

[services.env]
PORT = "21147"
BASE_PATH = "/"
