# WariVerse — development stack.
#   docker compose up -d db redis      # infra only
#   docker compose up                  # everything
#
# Phase 1 ships db, redis and core-api; Phase 3 adds ai-engine; Phase 4 adds
# admin-console; Phase 7 adds pilgrim-pwa.  Later phases add the notifier and
# the volunteer app; their blocks land as they are built.

services:
  db:
    # timescaledb-ha bundles TimescaleDB *and* PostGIS on PG16 — we need both
    # (density hypertable + zone polygons).
    image: timescale/timescaledb-ha:pg16
    container_name: wariverse-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wariverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-wariverse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wariverse} -d ${POSTGRES_DB:-wariverse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wariverse-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: wariverse-core-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wariverse}:${POSTGRES_PASSWORD:-change-me-in-prod}@db:5432/${POSTGRES_DB:-wariverse}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/core-api:/app
    # Migrations run on boot so a fresh clone is one command away from working.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  scheduler:
    # Same image as core-api, different entrypoint: the reslotting and no-show
    # timers. Separate so restarting the API does not skip a reslot, and so
    # scaling the API to N replicas does not run the jobs N times.
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: wariverse-scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wariverse}:${POSTGRES_PASSWORD:-change-me-in-prod}@db:5432/${POSTGRES_DB:-wariverse}
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    volumes:
      - ./services/core-api:/app
    command: ["python", "-m", "app.workers.scheduler"]
    # The image's healthcheck curls the API port; this process serves no HTTP,
    # so inheriting it would mark a working scheduler unhealthy forever.
    healthcheck:
      disable: true
    restart: unless-stopped

  ai-engine:
    # Crowd analytics. A separate service because it is the process most likely
    # to need a kick at 3 a.m., and Section 6 puts everything that must survive
    # that on the other side of an HTTP boundary. It holds no database
    # credentials and publishes through POST /api/v1/ingest/density only.
    #
    # The default build is the slim one: CROWD_SOURCE=sim needs no vision stack.
    # For real cameras:  docker compose build --build-arg WITH_VISION=1 ai-engine
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
      args:
        WITH_VISION: ${WITH_VISION:-0}
    container_name: wariverse-ai-engine
    env_file: .env
    environment:
      CORE_API_URL: http://core-api:8000
      SERVICE_NAME: ai-engine
    ports:
      - "${AI_ENGINE_PORT:-8100}:8100"
    depends_on:
      core-api:
        condition: service_started
    volumes:
      - ./services/ai-engine:/app
      # Drop sample crowd videos here and set CROWD_SOURCE=video.
      - ./data/videos:/data/videos:ro
    # Deliberately *not* depends_on: service_healthy for core-api. The engine
    # is built to start before its dependency and buffer — making compose
    # enforce the ordering would hide whether that actually works.
    restart: unless-stopped

  admin-console:
    # The Temple Command Center (Phase 4). nginx serves the built assets and
    # reverse-proxies /api to core-api, so the browser sees one origin and CORS
    # never has to be right for the console to work.
    build:
      context: ./apps/admin-console
      dockerfile: Dockerfile
    container_name: wariverse-admin-console
    ports:
      - "${ADMIN_CONSOLE_PORT:-5173}:80"
    depends_on:
      core-api:
        condition: service_started
    restart: unless-stopped

  pilgrim-pwa:
    # The pilgrim app (Phase 7). Offline-first, Marathi-first, and built to a
    # 200 KB gzipped JS budget that the image build itself enforces — see the
    # `npm run budget` step in its Dockerfile.
    build:
      context: ./apps/pilgrim-pwa
      dockerfile: Dockerfile
    container_name: wariverse-pilgrim-pwa
    ports:
      - "${PILGRIM_PWA_PORT:-5174}:80"
    depends_on:
      core-api:
        condition: service_started
    restart: unless-stopped

  # --- observability (Section 11, Phase 10) --------------------------------
  # Behind a profile, so `docker compose up` stays the ten-second path the
  # README promises and nobody pays 300 MB of Grafana to look at a pass booking.
  # Bring it up deliberately:
  #
  #     docker compose --profile observability up -d
  #
  # Grafana on :3000 (admin/admin on first run), Prometheus on :9090.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: wariverse-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days: long enough to answer "what did the pipeline look like during
      # the Wari" at the post-event review, which is the only reason this data
      # outlives the week.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: wariverse-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # A control room screen nobody has to log into. Viewer-only, so the board
      # can be left up on a wall without leaving an editable Grafana unattended.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
