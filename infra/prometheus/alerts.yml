# Alert rules (Section 11 OBSERVABILITY, Phase 10).
#
# Section 11 names one alert explicitly — "alerting on camera heartbeat loss
# > 2 min" — and that one is `CameraHeartbeatLost` below. The rest exist
# because an alert that only fires when a camera dies leaves the other ways
# this system can quietly stop working unwatched.
#
# THE PRINCIPLE THESE ARE WRITTEN TO
#
# Every rule here alerts on the system going BLIND or SILENT, never on the
# crowd being busy. A dense zone is not an incident — it is Tuesday of the
# Wari, and the product already has a whole alert pipeline for it that reaches
# an operator with a recommended action. Paging an engineer at 2 a.m. because
# Zone C hit 4 p/m² would train them to silence the pager, and the pager is
# also how they would hear that the cameras had gone dark.
#
# So: `wariverse_zone_density` appears in no rule below. `wariverse_zone_
# reading_age_seconds` appears in two.
#
# Severity means who wakes up:
#   page     — someone is woken. Reserved for "the control room cannot see".
#   ticket   — visible on the board, handled in hours.
#   info     — recorded, reviewed after the Wari.

groups:
  - name: wariverse-visibility
    interval: 15s
    rules:
      # ---- Section 11's named alert ------------------------------------
      - alert: CameraHeartbeatLost
        # `camera_offline_seconds` defaults to 120s, so a camera is already
        # marked offline by the watchdog before this fires. The 2m `for` on top
        # of that is deliberate: one camera flapping through a bad PoE switch is
        # not worth waking anybody, and a corridor that has genuinely gone dark
        # stays dark.
        expr: wariverse_cameras_online < wariverse_cameras_total
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} camera(s) have stopped sending heartbeats"
          description: >-
            Zones covered by these cameras are now estimating rather than
            measuring. Their density figures carry a reduced confidence and the
            console shows a coverage alert. Check the NVR and the PoE switch
            before assuming the cameras themselves failed.
          runbook: docs/runbook.md#the-ai-service-is-down

      - alert: MostCamerasOffline
        # Losing a third of the estate at once is not a camera fault, it is a
        # switch, a power rail or the NVR. Different response, so different
        # alert, and this one wakes somebody.
        expr: wariverse_cameras_online < (wariverse_cameras_total * 0.67)
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Over a third of cameras are offline"
          description: >-
            This is infrastructure, not optics. Check power and the network
            before touching individual cameras. The command centre is running
            substantially blind; tell the duty officer to move to radio
            reporting from zone marshals.
          runbook: docs/runbook.md#the-ai-service-is-down

      - alert: ZoneReadingStale
        # Fires on the AGE of a reading, never on its value. A zone that stopped
        # being measured and a zone that is empty produce identical density
        # numbers; only the age tells them apart.
        expr: wariverse_zone_reading_age_seconds > 300
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Zone {{ $labels.zone }} has not reported for 5 minutes"
          description: >-
            The console renders this zone as UNKNOWN, not as clear. Confirm the
            AI engine is running and that this zone still has a calibrated
            camera. Do not treat the last figure as current.
          runbook: docs/runbook.md#the-ai-service-is-down

      - alert: EveryZoneStale
        expr: min(wariverse_zone_reading_age_seconds) > 300
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No zone has reported for 5 minutes — the pipeline is down"
          description: >-
            The AI engine is not delivering. Passes, incidents, SOS and the
            breach ledger are unaffected and keep working. Follow the runbook:
            the control room moves to radio crowd reporting and the pilgrim app
            shows UNKNOWN rather than a stale colour.
          runbook: docs/runbook.md#the-ai-service-is-down

      - alert: IngestStopped
        expr: rate(wariverse_readings_ingested_total[5m]) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No crowd readings accepted in five minutes"
          description: >-
            Either the AI engine is down or its service token is being rejected.
            Check `wariverse_readings_rejected_total` — a rising rejection
            counter with zero acceptances means authentication or clock skew,
            not a dead process.

      - alert: ReadingsBeingRejected
        expr: rate(wariverse_readings_rejected_total[5m]) > 0.2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Crowd readings are being refused ({{ $labels.reason }})"
          description: >-
            A steady rejection rate usually means the AI engine is working from
            a zone geometry that has since been re-surveyed, or its clock has
            drifted outside the accepted window.

  - name: wariverse-service
    interval: 15s
    rules:
      - alert: ApiLatencyOverTarget
        # Section 11: API p95 < 300ms. Measured over 10 minutes so a single slow
        # analytics export does not page anybody.
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(wariverse_http_request_duration_seconds_bucket[10m])) by (le, path)
          ) > 0.3
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "p95 latency on {{ $labels.path }} is over the 300ms target"
          description: >-
            Section 11's latency target. During a release window check the slot
            contention path first — `POST /passes` is the only heavily contended
            write in the system.

      - alert: ApiErrorRate
        expr: >-
          sum(rate(wariverse_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(wariverse_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Over 1% of requests are returning 5xx"
          description: >-
            Find the trace id from any error envelope and grep the JSON logs for
            it. Every error the API emits carries one.

      - alert: ApiDown
        expr: up{job="core-api"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "core-api is not being scraped"
          description: >-
            If this fires alone, the API is down and nothing else in the product
            works. Check the container, then the database — core-api will not
            start if Postgres is unreachable.

  - name: wariverse-operations
    interval: 30s
    rules:
      - alert: IncidentSlaBreaches
        # Not "an incident happened" — incidents are the product working. This
        # fires when incidents pass their deadline with nobody assigned, which
        # is a control-room staffing signal rather than a software fault.
        expr: rate(wariverse_incident_sla_breaches_total[15m]) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Incidents are breaching their SLA with no responder assigned"
          description: >-
            The control room is not keeping up. This is a staffing question, not
            an engineering one — escalate to the duty officer rather than to
            the on-call engineer.

      - alert: CriticalAlertsUnacknowledged
        expr: wariverse_alerts_open{severity="critical"} > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} critical crowd alert(s) open for over five minutes"
          description: >-
            The in-product escalation has already fired twice by now. If nobody
            has acknowledged, assume the console is not being watched and reach
            the control room by phone.

      - alert: PalkhiTrackingBlind
        # Phase 9. A halt town provisioning for groups it cannot see is the M8
        # failure mode; this is the metric that catches it before the town does.
        expr: wariverse_dindis_silent > wariverse_dindis_reporting
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "More Dindis are silent than reporting"
          description: >-
            The halt-town board is guessing for most of the route. Usual cause
            is flat batteries rather than anything server-side — the phones back
            off their reporting interval as they drain, and below 10% they
            report every fifteen minutes. Call the Dindi leaders.

      - alert: AssistantDegradedSilently
        # The fallback is designed to be survivable, which is exactly why it
        # needs an alarm: it works well enough that nobody would notice it had
        # been running for three days on an expired API key.
        expr: rate(wariverse_assistant_turns_total{outcome="degraded"}[30m]) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "The assistant has been answering without its model for 30 minutes"
          description: >-
            Pilgrims are getting correct but terse templated answers. Check
            GEMINI_API_KEY and the provider's status. Nothing is broken for the
            user; this is a quality regression, not an outage.
