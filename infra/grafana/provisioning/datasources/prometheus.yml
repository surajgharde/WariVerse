# Grafana datasource, provisioned rather than clicked (Section 11, Phase 10).
#
# A dashboard somebody wired by hand in the UI exists only on that Grafana's
# disk. On the day this is redeployed mid-Wari, it comes back blank. Everything
# under `infra/grafana/` is in the repo so the board is reproducible.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match `scrape_interval` in prometheus.yml or the rate() windows
      # Grafana suggests will be wrong.
      timeInterval: 15s
