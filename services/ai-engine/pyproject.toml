[project]
name = "wariverse-ai-engine"
version = "0.1.0"
description = "WariVerse crowd analytics — simulation, detection, tracking, zone metrics"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # asserts are the point in tests
    "B008",  # FastAPI's Depends() in defaults is the framework idiom
    "S105",  # matches identifier *names* containing "token"; bandit does the real check
    "S106",
    # These exceptions say what is *unavailable*, not what went wrong, and read
    # better at the call site as `except VideoUnavailable`. Same call as
    # core-api makes for AppError.
    "N818",
    # The prose in this codebase uses en dashes and typographic quotes on
    # purpose; the Marathi strings need the full range regardless.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The simulation deliberately uses the stdlib PRNG. It generates crowd
# telemetry, not keys, and it is seeded so runs are reproducible.
"app/sim_engine.py" = ["S311"]
"tests/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "vision: needs ultralytics and opencv installed",
]

[tool.bandit]
exclude_dirs = ["./tests", "./.venv"]
skips = ["B104", "B105", "B106"]
