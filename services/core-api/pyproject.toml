[project]
name = "wariverse-core-api"
version = "0.1.0"
description = "WariVerse Core API — passes, incidents, zones, breach review, audit"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # asserts are the point in tests
    "B008",  # FastAPI's Depends() in defaults is the framework idiom
    "N818",  # AppError is deliberately not named AppException
    # S105/S106/S107 match on identifier *names*, so every Permission.PASS_*
    # and AuditAction.TOKEN_* trips them.  Real secret scanning is bandit's job
    # (it runs in CI); leaving these on here only teaches people to ignore ruff.
    "S105",
    "S106",
    "S107",
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false
exclude = "alembic/"

[[tool.mypy.overrides]]
# Tests use pytest fixtures, whose signatures mypy cannot infer without
# annotating every fixture argument.  Strictness here buys noise, not safety;
# the application code stays strict.
module = "app.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
# One loop per test, shared by that test's fixtures.  The Redis client is a
# module-level singleton whose pooled connections bind to the loop that first
# used them, so fixtures and tests must not run on different loops.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "db: requires a live Postgres with PostGIS and TimescaleDB",
    "redis: requires a live Redis",
    "slow: scale tests; run in CI, deselect locally with -m 'not slow'",
]

[tool.bandit]
exclude_dirs = ["./app/tests", "./alembic", "./.venv"]
# B105/B106/B107 flag *identifier names* containing "pass"/"token"/"secret", so
# every Permission.PASS_* and AuditAction.TOKEN_* trips them.  Real secrets are
# kept out of the repo by configuration, not by this heuristic.
skips = ["B105", "B106", "B107"]
