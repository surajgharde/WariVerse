<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8622B" />
    <meta name="description" content="पंढरपूर वारी — दर्शन पास, गर्दीची माहिती आणि मदत" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>वारीव्हर्स</title>

    <!--
      Critical CSS inline, and it is deliberately just enough to paint the first
      screen without a flash. Section 4/M7 asks for LCP under 2.5s on 3G; a
      render-blocking stylesheet round trip is most of that budget on its own.
    -->
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; background: #FAF7F2; color: #16181D; }
      body { font-size: 18px; font-family: system-ui, 'Nirmala UI', sans-serif; }
      #root { min-height: 100vh; }
      .boot { padding: 24px; font-size: 18px; color: #5b6270; }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">थांबा…</p></div>

    <!--
      Section 4/M7: "fully usable without JS for the pass QR (server-rendered
      fallback page)". A pilgrim whose phone cannot run this app still needs to
      get through the gate, and that path must not depend on the thing that has
      failed.
    -->
    <noscript>
      <div class="boot">
        <p>
          हे अ‍ॅप चालण्यासाठी JavaScript आवश्यक आहे. तुमचा पास पाहण्यासाठी
          <a href="/pass">इथे क्लिक करा</a>.
        </p>
        <p>आपत्कालीन मदतीसाठी <a href="tel:108">108</a> वर फोन करा.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
