upstream core_api {
    server core-api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A control-room screen has no business being indexed, framed or sniffed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames: cache hard. index.html is not hashed and must not
    # be cached, or an operator refreshing after a deploy gets the old shell
    # pointing at deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket ---------------------------------------------------------
    # Separate block because of the last line. `ws.py` warns that the access
    # token rides in the query string (browsers cannot set a header on a
    # WebSocket), and that whatever sits in front must not log it. This is that
    # configuration — without it, every operator's access token lands in an
    # nginx access log in cleartext.
    location /api/v1/ws/ {
        proxy_pass http://core_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The socket is idle-by-design between heartbeats (20s). The default
        # 60s read timeout would cut a healthy connection roughly hourly.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        access_log off;
    }

    # SPA fallback — every other path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
