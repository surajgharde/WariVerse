name: admin-console

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-console/**"
      - ".github/workflows/admin-console.yml"
  pull_request:
    paths:
      - "apps/admin-console/**"
      - ".github/workflows/admin-console.yml"

concurrency:
  group: admin-console-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/admin-console

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  contract:
    # The console's wire types are hand-written (see `src/api/types.ts`). That is
    # a deliberate trade — eleven endpoints do not justify a generated client —
    # but it means a server-side rename can drift silently. This job boots the
    # API, reads its OpenAPI document, and checks that the routes and response
    # fields the console depends on are still there.
    #
    # It checks the contract, not the whole schema: a new optional field on the
    # server should not fail the console's build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt

      - name: Install core API
        working-directory: services/core-api
        run: pip install -r requirements.txt

      - name: Check the endpoints and fields the console reads
        working-directory: services/core-api
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real-0000
          PHONE_HASH_SECRET: ci-only-phone-hash-secret-not-used-real-000
          AI_SERVICE_TOKEN: ci-only-ai-service-token
          CONTACT_ENCRYPTION_KEY: dGVzdC1jb250YWN0LWtleS10ZXN0LWNvbnRhY3Qta2V5PQ==
        run: |
          python - <<'PY'
          from app.main import app

          schema = app.openapi()
          paths = schema["paths"]
          components = schema["components"]["schemas"]

          required_paths = [
              "/api/v1/auth/login",
              "/api/v1/auth/mfa/verify",
              "/api/v1/auth/me",
              "/api/v1/auth/refresh",
              "/api/v1/auth/logout",
              "/api/v1/zones",
              "/api/v1/crowd/live",
              "/api/v1/cameras",
              "/api/v1/alerts",
              "/api/v1/alerts/rules",
              "/api/v1/alerts/{alert_id}/ack",
              "/api/v1/alerts/{alert_id}/resolve",
              "/api/v1/command/kpis",
              "/api/v1/command/changes",
              "/api/v1/command/replay",
              "/api/v1/command/config",
              "/api/v1/incidents",
              "/api/v1/incidents/{incident_id}",
              "/api/v1/incidents/{incident_id}/dispatch",
              "/api/v1/incidents/{incident_id}/dispatch-options",
              "/api/v1/responders",
              "/api/v1/missing-persons",
              "/api/v1/sos",
              "/api/v1/breaches",
              "/api/v1/breaches/{breach_id}",
              "/api/v1/breaches/{breach_id}/review",
              "/api/v1/breaches/{breach_id}/clip",
              "/api/v1/breaches/verify",
              "/api/v1/breaches/summary",
              "/api/v1/tripwires",
          ]
          missing = [p for p in required_paths if p not in paths]
          assert not missing, f"the console calls routes that no longer exist: {missing}"

          # Fields the console reads by name. A rename here is a silent break in
          # a hand-written client, which is exactly what this catches.
          required_fields = {
              "Kpi": {"key", "label", "label_mr", "value", "unit", "target",
                      "as_of", "age_seconds", "is_stale", "source", "state",
                      "detail", "note", "note_mr"},
              "KpiStrip": {"kpis", "generated_at", "stale_count", "unknown_count"},
              "ChangeItem": {"at", "kind", "severity", "summary", "summary_mr",
                             "zone_code", "ref_type", "ref_id"},
              "ChangeDigest": {"since", "until", "items", "truncated"},
              "ReplayFrame": {"at", "zones", "unknown_zones", "open_alerts", "critical_alerts"},
              "ReplayWindow": {"since", "until", "step_seconds", "frames",
                               "zone_codes", "note", "note_mr"},
              "ReplayZoneState": {"zone_id", "zone_code", "density", "level",
                                  "person_count", "sample_count"},
              "ConsoleConfig": {"alert_escalate_seconds", "alert_page_seconds",
                                "stale_reading_seconds", "crowd_source",
                                "density_thresholds", "server_time"},
              "ZoneStatusDetail": {"zone_id", "zone_code", "zone_name", "zone_name_mr",
                                   "person_count", "density", "level", "flow",
                                   "observed_at", "age_seconds", "is_stale", "notes"},
              "AlertOut": {"id", "type", "severity", "status", "zone_code",
                           "trigger_metric", "trigger_value", "threshold_value",
                           "confidence", "recommended_action", "recommended_action_mr",
                           "rule_id", "escalation_level", "acknowledged_at", "created_at"},
              "IncidentOut": {"id", "reference", "type", "severity", "status", "source",
                              "zone_id", "zone_code", "location", "description",
                              "has_audio_note", "sla_due_at", "sla_breached",
                              "seconds_to_sla", "first_response_at",
                              "assigned_responder_id", "assigned_call_sign",
                              "client_reported_at", "delayed_by_seconds",
                              "outcome_note", "created_at", "seconds_open", "timeline"},
              "SuggestionOut": {"responder_id", "call_sign", "unit_type",
                                "distance_m", "eta_seconds", "type_rank", "caveats"},
              "DispatchOptions": {"incident_id", "suggestions", "available_units",
                                  "note", "note_mr"},
              "ResponderOut": {"id", "call_sign", "unit_type", "status", "location",
                               "last_ping_at", "seconds_since_ping",
                               "assigned_incident_id", "assigned_incident_reference"},
              "MissingPersonOut": {"id", "incident_id", "incident_reference", "name",
                                   "age", "has_photo", "last_seen_zone_code", "status",
                                   "reported_at", "purge_after", "open_for_seconds"},
              "SosAck": {"incident_id", "reference", "status", "message", "message_mr",
                         "responder_eta_seconds", "joined_existing"},
              "BreachOut": {"id", "sequence", "tripwire_id", "camera_id", "gate_id",
                            "gate_code", "occurred_at", "direction", "crossing_count",
                            "confidence", "has_clip", "clip_sha256", "pass_scan_checked",
                            "review_status", "reviewed_at", "review_reason",
                            "redacted_at", "redaction_reason", "chain_hash", "prev_hash",
                            "purge_after", "clip_views"},
              "ChainReportOut": {"events_checked", "intact", "breaks", "head_hash",
                                 "verified_at", "note", "note_mr"},
              "ChainBreakOut": {"sequence", "breach_id", "problem", "expected", "found"},
              "ClipOut": {"breach_id", "sequence", "clip_uri", "clip_sha256",
                          "notice", "notice_mr", "logged_at"},
              "DailySummaryOut": {"day", "total", "by_review_status", "by_gate_hour",
                                  "chain_intact", "chain_head", "notice", "notice_mr"},
          }

          # The ledger's hard constraint, checked as a contract rather than left
          # to review: no schema in the breach module may carry a field that
          # could identify a person. Section 4/M5 and Section 12.
          identifying = {"track_id", "person_id", "face", "embedding", "identity",
                         "holder_phone_hash", "phone", "reporter_phone_hash"}
          for model in ("BreachOut", "ClipOut", "DailySummaryOut", "CrossingIn"):
              if model not in components:
                  continue
              leaked = set(components[model].get("properties", {})) & identifying
              assert not leaked, f"{model} exposes identifying field(s): {sorted(leaked)}"


          problems = []
          for model, fields in required_fields.items():
              if model not in components:
                  problems.append(f"{model} is gone from the schema")
                  continue
              have = set(components[model].get("properties", {}))
              lost = fields - have
              if lost:
                  problems.append(f"{model} no longer has {sorted(lost)}")

          assert not problems, "console contract broken:\n  " + "\n  ".join(problems)
          print(f"contract ok: {len(required_paths)} routes, {len(required_fields)} models")
          PY
