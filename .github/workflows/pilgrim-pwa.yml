name: pilgrim-pwa

on:
  push:
    branches: [main]
    paths:
      - "apps/pilgrim-pwa/**"
      - ".github/workflows/pilgrim-pwa.yml"
  pull_request:
    paths:
      - "apps/pilgrim-pwa/**"
      - ".github/workflows/pilgrim-pwa.yml"

concurrency:
  group: pilgrim-pwa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/pilgrim-pwa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pilgrim-pwa/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget
        # Section 4/M7: "first load < 200 KB gzipped JS". This fails the build
        # rather than warning, so adding a heavy dependency is a decision
        # somebody has to make deliberately.
        run: npm run budget

  rolling-code:
    # The single highest-stakes contract in this app: the pass QR the phone
    # computes offline must equal the one the scanner validates. A mismatch
    # produces a well-formed code that is rejected at the gate, which is
    # indistinguishable from a forged pass to the volunteer holding the scanner.
    #
    # `totp.test.ts` pins vectors generated by the server. This job regenerates
    # them from the *current* server and fails if the pinned ones have drifted —
    # so changing `qr_service.py` cannot silently invalidate every pass in
    # circulation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt

      - name: Install core API
        working-directory: services/core-api
        run: pip install -r requirements.txt

      - name: The server still produces the vectors the client pins
        working-directory: services/core-api
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real-0000
          PHONE_HASH_SECRET: ci-only-phone-hash-secret-not-used-real-000
          AI_SERVICE_TOKEN: ci-only-ai-service-token
          CONTACT_ENCRYPTION_KEY: dGVzdC1jb250YWN0LWtleS10ZXN0LWNvbnRhY3Qta2V5PQ==
        run: |
          python - <<'PY'
          import re, pathlib
          from datetime import datetime, UTC
          from app.services import qr_service

          # The parameters the client hardcodes. Any change here invalidates
          # every pass already in a pilgrim's pocket.
          assert qr_service.ROLLING_STEP_SECONDS == 60, "step changed — clients will not match"
          assert qr_service.ROLLING_DIGITS == 8, "digit count changed — clients will not match"
          assert qr_service.QR_PREFIX == "WV1", "QR prefix changed — scanners will not match"

          source = pathlib.Path("../../apps/pilgrim-pwa/src/lib/totp.test.ts").read_text(encoding="utf-8")
          vectors = re.findall(r"\['([A-Z2-7]+)', (\d+), '(\d{8})'\]", source)
          assert vectors, "no pinned vectors found in totp.test.ts"

          bad = []
          for secret, unix, expected in vectors:
              actual = qr_service.rolling_code(secret, datetime.fromtimestamp(int(unix), UTC))
              if actual != expected:
                  bad.append(f"{secret} @ {unix}: client pins {expected}, server now makes {actual}")

          if bad:
              raise SystemExit(
                  "The rolling code has drifted from what the pilgrim app computes.\n"
                  "Every pass in circulation would be rejected at the gate.\n  "
                  + "\n  ".join(bad)
              )
          print(f"{len(vectors)} vectors still agree with the server")
          PY
