name: core-api

on:
  push:
    branches: [main]
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api.yml"
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api.yml"

concurrency:
  group: core-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/core-api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        # Same image as docker-compose: TimescaleDB + PostGIS on PG16.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: wariverse
          POSTGRES_PASSWORD: wariverse
          POSTGRES_DB: wariverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wariverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://wariverse:wariverse@localhost:5432/wariverse
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/core-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        # REQUIRE_INTEGRATION turns "Postgres unavailable -> skip" into a hard
        # failure, so a broken service container cannot pass as a green build.
        env:
          REQUIRE_INTEGRATION: "1"
        run: pytest -q -rs --cov=app --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tooling
        run: pip install bandit==1.8.0 pip-audit==2.7.3
      - name: Static security scan
        # -ll: fail on medium severity and above. Test asserts are excluded.
        run: bandit -c pyproject.toml -r app -x app/tests -ll -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
